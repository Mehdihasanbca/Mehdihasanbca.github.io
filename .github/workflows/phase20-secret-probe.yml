name: AVC Razorpay Secret Readiness Probe

on:
  push:
    branches: [main]
    paths:
      - phase20-secret-probe-trigger.txt
      - .github/workflows/phase20-secret-probe.yml
      - worker/payment-api.js
      - wrangler.toml
      - scripts/finalize_payment_activation.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_LIVE_API_KEY: ${{ secrets.RAZORPAY_LIVE_API_KEY }}
      RAZORPAY_LIVE_KEY_SECRET: ${{ secrets.RAZORPAY_LIVE_KEY_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      RAZORPAY_TRUSTED_BUSINESS_ENABLED: ${{ vars.RAZORPAY_TRUSTED_BUSINESS_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Razorpay and Cloudflare credentials
        shell: bash
        run: |
          set -e
          echo "::add-mask::${RAZORPAY_LIVE_API_KEY}"
          echo "::add-mask::${RAZORPAY_LIVE_KEY_SECRET}"
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          test -n "${RAZORPAY_LIVE_API_KEY}"
          test -n "${RAZORPAY_LIVE_KEY_SECRET}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test "$(curl -sS -o /tmp/rzp.json -w '%{http_code}' -u "${RAZORPAY_LIVE_API_KEY}:${RAZORPAY_LIVE_KEY_SECRET}" 'https://api.razorpay.com/v1/orders?count=1')" = "200"
          test "$(curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 'https://api.cloudflare.com/client/v4/user/tokens/verify')" = "200"
          grep -Fq '"success":true' /tmp/cf.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy payment Worker
        id: deploy
        continue-on-error: true
        run: npx wrangler deploy

      - name: Set Razorpay Worker secrets
        id: worker_secrets
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          printf '%s' "${RAZORPAY_LIVE_API_KEY}" | npx wrangler secret put RAZORPAY_KEY_ID
          printf '%s' "${RAZORPAY_LIVE_KEY_SECRET}" | npx wrangler secret put RAZORPAY_KEY_SECRET
          if [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "${RAZORPAY_WEBHOOK_SECRET}" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize public activation state
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SECRETS_OUTCOME: ${{ steps.worker_secrets.outcome }}
        run: python scripts/finalize_payment_activation.py

      - name: Commit activation evidence
        if: always()
        run: |
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-live-status.txt assets/payment-config.js
          if ! git diff --cached --quiet; then
            git commit -m 'Record AVC Razorpay live payment activation'
            git push
          fi
