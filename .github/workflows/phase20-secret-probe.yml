name: AVC Razorpay Secret Readiness Probe

on:
  push:
    branches: [main]
    paths:
      - phase20-secret-probe-trigger.txt
      - .github/workflows/phase20-secret-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RZP_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RZP_API_KEY: ${{ secrets.RAZORPAY_API_KEY }}
      RZP_API_KEY_ID: ${{ secrets.RAZORPAY_API_KEY_ID }}
      RZP_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RZP_API_SECRET: ${{ secrets.RAZORPAY_API_SECRET }}
      RZP_API_KEY_SECRET: ${{ secrets.RAZORPAY_API_KEY_SECRET }}
      RZP_COMBINED: ${{ secrets.RAZORPAY_API }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ALT: ${{ secrets.CF_ACCOUNT_ID }}
      MEDICAL_FEE: ${{ secrets.AVC_MEDICAL_TOTAL_PAISE }}
      MEDICAL_FEE_ALT: ${{ secrets.MEDICAL_TOTAL_PAISE }}
      MEDICAL_FEE_VAR: ${{ vars.AVC_MEDICAL_TOTAL_PAISE }}
      WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Write yes-no readiness and matching secret names only
        shell: bash
        run: |
          id=no; secret=no; combined=no; cf_token=no; cf_account=no; fee=no; webhook=no; mode=unknown
          KEY_ID="${RZP_KEY_ID:-${RZP_API_KEY:-${RZP_API_KEY_ID:-}}}"
          KEY_SECRET="${RZP_KEY_SECRET:-${RZP_API_SECRET:-${RZP_API_KEY_SECRET:-}}}"
          [ -n "$KEY_ID" ] && id=yes
          [ -n "$KEY_SECRET" ] && secret=yes
          [ -n "${RZP_COMBINED:-}" ] && combined=yes
          if [[ "$KEY_ID" == rzp_live_* ]]; then mode=live; elif [[ "$KEY_ID" == rzp_test_* ]]; then mode=test; fi
          { [ -n "${CF_TOKEN:-}" ] || [ -n "${CF_TOKEN_ALT:-}" ]; } && cf_token=yes
          { [ -n "${CF_ACCOUNT:-}" ] || [ -n "${CF_ACCOUNT_ALT:-}" ]; } && cf_account=yes
          FEE="${MEDICAL_FEE:-${MEDICAL_FEE_ALT:-${MEDICAL_FEE_VAR:-}}}"
          [[ "$FEE" =~ ^[1-9][0-9]*$ ]] && fee=yes
          [ -n "${WEBHOOK_SECRET:-}" ] && webhook=yes
          python - <<'PY' > /tmp/names.txt
          import json, os
          try:
              data=json.loads(os.environ.get('ALL_SECRETS_JSON') or '{}')
          except Exception:
              data={}
          names=[]
          for key in data:
              u=key.upper()
              if u.startswith('RAZORPAY') or u.startswith('CLOUDFLARE') or u.startswith('CF_') or u.startswith('AVC_MEDICAL') or u.startswith('MEDICAL_'):
                  names.append(key)
          print('matching_secret_names=' + (','.join(sorted(names)) if names else 'none'))
          PY
          {
            echo 'AVC Razorpay secret readiness probe'
            echo "razorpay_key_id_present=$id"
            echo "razorpay_key_secret_present=$secret"
            echo "razorpay_combined_secret_present=$combined"
            echo "razorpay_mode=$mode"
            echo "cloudflare_api_token_present=$cf_token"
            echo "cloudflare_account_id_present=$cf_account"
            echo "medical_total_paise_configured=$fee"
            echo "razorpay_webhook_secret_present=$webhook"
            cat /tmp/names.txt
            echo 'secret_values_exposed=no'
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-secret-readiness.txt
          cat phase20-secret-readiness.txt
      - name: Commit readiness evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-secret-readiness.txt
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Razorpay secret readiness'; git push; fi
