name: AVC Razorpay Secret Readiness Probe

on:
  push:
    branches: [main]
    paths:
      - phase20-secret-probe-trigger.txt
      - .github/workflows/phase20-secret-probe.yml
      - worker/payment-api.js
      - wrangler.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RZP_LIVE_API_KEY: ${{ secrets.RAZORPAY_LIVE_API_KEY }}
      RZP_LIVE_KEY_SECRET: ${{ secrets.RAZORPAY_LIVE_KEY_SECRET }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      TRUSTED_FLAG: ${{ vars.RAZORPAY_TRUSTED_BUSINESS_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify credentials, deploy Worker and write safe status
        shell: bash
        run: |
          set +e
          id=no; secret=no; cf_token=no; webhook=no; mode=unknown; auth=no; cf_auth=no; deployed=no; worker_secrets=no; health=no; checkout=false
          [ -n "${RZP_LIVE_API_KEY:-}" ] && id=yes
          [ -n "${RZP_LIVE_KEY_SECRET:-}" ] && secret=yes
          [ -n "${CF_TOKEN:-}" ] && cf_token=yes
          [ -n "${WEBHOOK_SECRET:-}" ] && webhook=yes
          [[ "${RZP_LIVE_API_KEY:-}" == rzp_live_* ]] && mode=live
          for v in "${RZP_LIVE_API_KEY:-}" "${RZP_LIVE_KEY_SECRET:-}" "${CF_TOKEN:-}" "${WEBHOOK_SECRET:-}"; do [ -z "$v" ] || echo "::add-mask::$v"; done

          if [ "$id" = yes ] && [ "$secret" = yes ]; then
            code="$(curl -sS -o /tmp/rzp-auth.json -w '%{http_code}' -u "${RZP_LIVE_API_KEY}:${RZP_LIVE_KEY_SECRET}" 'https://api.razorpay.com/v1/orders?count=1' || true)"
            [ "$code" = 200 ] && auth=yes
          fi

          if [ "$cf_token" = yes ]; then
            code="$(curl -sS -o /tmp/cf-auth.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" 'https://api.cloudflare.com/client/v4/user/tokens/verify' || true)"
            if [ "$code" = 200 ] && grep -Fq '"success":true' /tmp/cf-auth.json; then cf_auth=yes; fi
          fi

          if [ "$auth" = yes ] && [ "$mode" = live ] && [ "$cf_auth" = yes ]; then
            npm install --no-save wrangler@4 >/dev/null 2>&1
            export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
            npx wrangler deploy >/tmp/wrangler-deploy.log 2>&1
            [ $? -eq 0 ] && deployed=yes
            if [ "$deployed" = yes ]; then
              printf '%s' "$RZP_LIVE_API_KEY" | npx wrangler secret put RAZORPAY_KEY_ID >/tmp/wrangler-key.log 2>&1; a=$?
              printf '%s' "$RZP_LIVE_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET >/tmp/wrangler-secret.log 2>&1; b=$?
              if [ "$webhook" = yes ]; then printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET >/tmp/wrangler-webhook.log 2>&1; fi
              [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && worker_secrets=yes
            fi
          fi

          if [ "$worker_secrets" = yes ]; then
            for i in $(seq 1 15); do
              body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me/api/payments/health?ts=$(date +%s)" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq '"service":"avc-payment-api"' && printf '%s' "$body" | grep -Fq '"razorpayConfigured":true' && printf '%s' "$body" | grep -Fq '"totalPaise":177000' && printf '%s' "$body" | grep -Fq '"wafidThirdPartyFeeIncluded":false'; then health=yes; break; fi
              sleep 6
            done
          fi

          [ "$auth" = yes ] && [ "$cf_auth" = yes ] && [ "$health" = yes ] && checkout=true
          trusted=false; [ "${TRUSTED_FLAG:-}" = true ] && trusted=true
          public_key=''; [ "$checkout" = true ] && public_key="$RZP_LIVE_API_KEY"

          cat > assets/payment-config.js <<EOF
          window.AVC_PAYMENT_CONFIG=Object.freeze({
            mode:'$mode',
            checkoutEnabled:$checkout,
            trustedBusinessClaimEnabled:$trusted,
            razorpayKeyId:'$public_key',
            orderEndpoint:'/api/payments/order',
            verifyEndpoint:'/api/payments/verify',
            webhookManagedServerSide:true,
            serviceBasePaise:150000,
            gstRate:18,
            gstPaise:27000,
            serviceTotalPaise:177000,
            wafidThirdPartyFeeIncluded:false,
            supportEmail:'info@assignmentvenuecentre.me',
            supportPhone:'+91 9473286356',
            note:'AVC Razorpay service payment is ₹1,770. Wafid third-party cost is separate. Key Secret remains server-side.'
          });
          EOF

          {
            echo 'AVC Razorpay secret readiness probe'
            echo "razorpay_live_api_key_present=$id"
            echo "razorpay_live_key_secret_present=$secret"
            echo "razorpay_mode=$mode"
            echo "razorpay_api_auth=$auth"
            echo "cloudflare_api_token_present=$cf_token"
            echo "cloudflare_api_auth=$cf_auth"
            echo "razorpay_webhook_secret_present=$webhook"
            echo 'avc_service_base_paise=150000'
            echo 'gst_rate_percent=18'
            echo 'gst_paise=27000'
            echo 'razorpay_order_total_paise=177000'
            echo 'wafid_third_party_fee_included=no'
            echo "worker_deployed=$deployed"
            echo "worker_razorpay_secrets_set=$worker_secrets"
            echo "payment_api_health=$health"
            echo "checkout_enabled=$checkout"
            echo "trusted_business_claim_enabled=$trusted"
            echo 'secret_values_exposed=no'
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-secret-readiness.txt

          {
            echo 'AVC Phase 20.1 final live payment deployment'
            echo "status=$([ "$checkout" = true ] && echo success_live_checkout || echo blocked_not_live)"
            echo "razorpay_api_auth=$auth"
            echo "cloudflare_api_auth=$cf_auth"
            echo "worker_deployed=$deployed"
            echo "worker_razorpay_secrets_set=$worker_secrets"
            echo "payment_api_health=$health"
            echo "checkout_enabled=$checkout"
            echo 'avc_service_base_paise=150000'
            echo 'gst_rate_percent=18'
            echo 'gst_paise=27000'
            echo 'razorpay_order_total_paise=177000'
            echo 'wafid_third_party_fee_included=no'
            echo "razorpay_webhook_secret_present=$webhook"
            echo "trusted_business_claim_enabled=$trusted"
            echo 'secret_values_exposed=no'
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-live-status.txt

          cat phase20-secret-readiness.txt
          cat phase20-live-status.txt

      - name: Commit readiness and activation evidence
        if: always()
        run: |
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-secret-readiness.txt phase20-live-status.txt assets/payment-config.js
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Razorpay live payment readiness'; git push; fi
