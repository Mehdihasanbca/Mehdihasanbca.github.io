name: AVC Razorpay Secret Readiness Probe

on:
  push:
    branches: [main]
    paths:
      - phase20-secret-probe-trigger.txt
      - .github/workflows/phase20-secret-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_LIVE_API_KEY: ${{ secrets.RAZORPAY_LIVE_API_KEY }}
      RAZORPAY_LIVE_KEY_SECRET: ${{ secrets.RAZORPAY_LIVE_KEY_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify credentials without exposing values
        shell: bash
        run: |
          set +e
          rzp_id=no; rzp_secret=no; rzp_auth=no; cf_present=no; cf_auth=no; webhook=no
          [ -n "${RAZORPAY_LIVE_API_KEY:-}" ] && rzp_id=yes
          [ -n "${RAZORPAY_LIVE_KEY_SECRET:-}" ] && rzp_secret=yes
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && cf_present=yes
          [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ] && webhook=yes
          for v in "${RAZORPAY_LIVE_API_KEY:-}" "${RAZORPAY_LIVE_KEY_SECRET:-}" "${CLOUDFLARE_API_TOKEN:-}" "${RAZORPAY_WEBHOOK_SECRET:-}"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          if [ "$rzp_id" = yes ] && [ "$rzp_secret" = yes ]; then
            code="$(curl -sS -o /tmp/rzp.json -w '%{http_code}' -u "${RAZORPAY_LIVE_API_KEY}:${RAZORPAY_LIVE_KEY_SECRET}" 'https://api.razorpay.com/v1/orders?count=1' || true)"
            [ "$code" = 200 ] && rzp_auth=yes
          fi
          if [ "$cf_present" = yes ]; then
            code="$(curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 'https://api.cloudflare.com/client/v4/user/tokens/verify' || true)"
            if [ "$code" = 200 ] && grep -Fq '"success":true' /tmp/cf.json; then cf_auth=yes; fi
          fi
          {
            echo 'AVC Razorpay and Cloudflare readiness probe'
            echo "razorpay_live_api_key_present=$rzp_id"
            echo "razorpay_live_key_secret_present=$rzp_secret"
            echo 'razorpay_mode=live'
            echo "razorpay_api_auth=$rzp_auth"
            echo "cloudflare_api_token_present=$cf_present"
            echo "cloudflare_api_auth=$cf_auth"
            echo "razorpay_webhook_secret_present=$webhook"
            echo 'avc_service_base_paise=150000'
            echo 'gst_rate_percent=18'
            echo 'gst_paise=27000'
            echo 'razorpay_order_total_paise=177000'
            echo 'wafid_third_party_fee_included=no'
            echo 'secret_values_exposed=no'
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-secret-readiness.txt
          cat phase20-secret-readiness.txt
      - name: Commit readiness evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-secret-readiness.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record AVC payment credential readiness'
            git push
          fi
