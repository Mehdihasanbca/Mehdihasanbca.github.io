name: AVC Razorpay Secret Readiness Probe

on:
  push:
    branches: [main]
    paths:
      - phase20-secret-probe-trigger.txt
      - .github/workflows/phase20-secret-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RZP_LIVE_API_KEY: ${{ secrets.RAZORPAY_LIVE_API_KEY }}
      RZP_LIVE_KEY_SECRET: ${{ secrets.RAZORPAY_LIVE_KEY_SECRET }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Write safe readiness only
        shell: bash
        run: |
          id=no; secret=no; cf_token=no; webhook=no; mode=unknown; auth=no
          [ -n "${RZP_LIVE_API_KEY:-}" ] && id=yes
          [ -n "${RZP_LIVE_KEY_SECRET:-}" ] && secret=yes
          [ -n "${CF_TOKEN:-}" ] && cf_token=yes
          [ -n "${WEBHOOK_SECRET:-}" ] && webhook=yes
          [[ "${RZP_LIVE_API_KEY:-}" == rzp_live_* ]] && mode=live
          for v in "${RZP_LIVE_API_KEY:-}" "${RZP_LIVE_KEY_SECRET:-}" "${CF_TOKEN:-}" "${WEBHOOK_SECRET:-}"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          if [ "$id" = yes ] && [ "$secret" = yes ]; then
            code="$(curl -sS -o /tmp/rzp-auth.json -w '%{http_code}' -u "${RZP_LIVE_API_KEY}:${RZP_LIVE_KEY_SECRET}" 'https://api.razorpay.com/v1/orders?count=1' || true)"
            [ "$code" = 200 ] && auth=yes
          fi
          {
            echo 'AVC Razorpay secret readiness probe'
            echo "razorpay_live_api_key_present=$id"
            echo "razorpay_live_key_secret_present=$secret"
            echo "razorpay_mode=$mode"
            echo "razorpay_api_auth=$auth"
            echo "cloudflare_api_token_present=$cf_token"
            echo "razorpay_webhook_secret_present=$webhook"
            echo 'avc_service_base_paise=150000'
            echo 'gst_rate_percent=18'
            echo 'gst_paise=27000'
            echo 'razorpay_order_total_paise=177000'
            echo 'wafid_third_party_fee_included=no'
            echo 'secret_values_exposed=no'
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-secret-readiness.txt
          cat phase20-secret-readiness.txt
      - name: Commit readiness evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-secret-readiness.txt
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Razorpay secret readiness'; git push; fi
