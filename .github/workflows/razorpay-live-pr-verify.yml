name: AVC Razorpay Live Deploy Verify

on:
  pull_request:
    branches: [main]
    paths:
      - payment-live-pr-trigger.txt
      - worker/payment-api.js
      - wrangler.toml
      - .github/workflows/razorpay-live-pr-verify.yml

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_LIVE_API_KEY: ${{ secrets.RAZORPAY_LIVE_API_KEY }}
      RAZORPAY_LIVE_KEY_SECRET: ${{ secrets.RAZORPAY_LIVE_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAZORPAY_TRUSTED_BUSINESS_ENABLED: ${{ vars.RAZORPAY_TRUSTED_BUSINESS_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify credentials and resolve Cloudflare resources
        shell: bash
        run: |
          set -euo pipefail
          for v in "${RAZORPAY_LIVE_API_KEY:-}" "${RAZORPAY_LIVE_KEY_SECRET:-}" "${CLOUDFLARE_API_TOKEN:-}" "${RAZORPAY_WEBHOOK_SECRET:-}"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          test -n "${RAZORPAY_LIVE_API_KEY:-}"
          test -n "${RAZORPAY_LIVE_KEY_SECRET:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          [[ "$RAZORPAY_LIVE_API_KEY" == rzp_live_* ]]
          test "$(curl -sS -o /tmp/rzp.json -w '%{http_code}' -u "${RAZORPAY_LIVE_API_KEY}:${RAZORPAY_LIVE_KEY_SECRET}" 'https://api.razorpay.com/v1/orders?count=1')" = "200"
          test "$(curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 'https://api.cloudflare.com/client/v4/user/tokens/verify')" = "200"
          grep -Fq '"success":true' /tmp/cf.json
          accounts="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 'https://api.cloudflare.com/client/v4/accounts')"
          account_id="$(printf '%s' "$accounts" | python -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0].get('id','') if r else '')")"
          zones="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 'https://api.cloudflare.com/client/v4/zones?name=assignmentvenuecentre.me')"
          zone_id="$(printf '%s' "$zones" | python -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0].get('id','') if r else '')")"
          if [ -z "$account_id" ]; then account_id="$(printf '%s' "$zones" | python -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(((r[0].get('account') or {}).get('id','')) if r else '')")"; fi
          test -n "$account_id"; test -n "$zone_id"
          echo "::add-mask::$account_id"; echo "::add-mask::$zone_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: Create one-hour Workers-only deployment token if permitted
        id: temp_token
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error, datetime
          base='https://api.cloudflare.com/client/v4'
          original=os.environ['CLOUDFLARE_API_TOKEN']
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          zone=os.environ['CLOUDFLARE_ZONE_ID']
          headers={'Authorization':'Bearer '+original,'Content-Type':'application/json'}
          def request(url, method='GET', payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode('utf-8','replace'))
                  except Exception: body={}
                  return e.code,body
          def build(groups):
              by={str(g.get('name')):g for g in groups}
              if 'Workers Scripts Write' not in by or 'Workers Routes Write' not in by: return None
              a=[by['Workers Scripts Write']['id']]
              z=[by['Workers Routes Write']['id']]
              if 'Account Settings Read' in by: a.append(by['Account Settings Read']['id'])
              if 'Zone Read' in by: z.append(by['Zone Read']['id'])
              now=datetime.datetime.now(datetime.timezone.utc); exp=now+datetime.timedelta(hours=1)
              return {'name':'AVC temporary Workers deploy '+now.strftime('%Y%m%dT%H%M%SZ'),
                'not_before':now.strftime('%Y-%m-%dT%H:%M:%SZ'),'expires_on':exp.strftime('%Y-%m-%dT%H:%M:%SZ'),
                'policies':[
                  {'effect':'allow','permission_groups':[{'id':x} for x in a], 'resources':{f'com.cloudflare.api.account.{account}':'*'}},
                  {'effect':'allow','permission_groups':[{'id':x} for x in z], 'resources':{f'com.cloudflare.api.account.zone.{zone}':'*'}}]}
          attempts=[]
          # User-owned token route: needs API Tokens Read/Write.
          code,p=request(base+'/user/tokens/permission_groups?per_page=1000'); attempts.append('user_groups_'+str(code))
          if code==200:
              payload=build(p.get('result') or [])
              if payload:
                  c,o=request(base+'/user/tokens','POST',payload); attempts.append('user_create_'+str(c))
                  result=o.get('result') or {}
                  if c in (200,201) and result.get('value') and result.get('id'):
                      open('/tmp/temp-token','w').write(result['value']); open('/tmp/temp-token-id','w').write(result['id']); open('/tmp/temp-token-kind','w').write('user'); open('/tmp/temp-token-attempts','w').write(','.join(attempts)); sys.exit(0)
          # Account-owned token route: needs Account API Tokens Read/Write.
          code,p=request(base+f'/accounts/{account}/tokens/permission_groups?per_page=1000'); attempts.append('account_groups_'+str(code))
          if code==200:
              payload=build(p.get('result') or [])
              if payload:
                  c,o=request(base+f'/accounts/{account}/tokens','POST',payload); attempts.append('account_create_'+str(c))
                  result=o.get('result') or {}
                  if c in (200,201) and result.get('value') and result.get('id'):
                      open('/tmp/temp-token','w').write(result['value']); open('/tmp/temp-token-id','w').write(result['id']); open('/tmp/temp-token-kind','w').write('account'); open('/tmp/temp-token-attempts','w').write(','.join(attempts)); sys.exit(0)
          open('/tmp/temp-token-attempts','w').write(','.join(attempts)); sys.exit(7)
          PY
          rc=$?
          attempts="$(cat /tmp/temp-token-attempts 2>/dev/null || echo none)"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then echo 'available=no' >> "$GITHUB_OUTPUT"; echo 'reason=token_mint_permission_unavailable' >> "$GITHUB_OUTPUT"; exit 0; fi
          temp="$(cat /tmp/temp-token)"; tid="$(cat /tmp/temp-token-id)"; kind="$(cat /tmp/temp-token-kind)"
          echo "::add-mask::$temp"; echo "::add-mask::$tid"
          echo "TEMP_CLOUDFLARE_API_TOKEN=$temp" >> "$GITHUB_ENV"
          echo "TEMP_CLOUDFLARE_TOKEN_ID=$tid" >> "$GITHUB_ENV"
          echo "TEMP_CLOUDFLARE_TOKEN_KIND=$kind" >> "$GITHUB_ENV"
          echo 'available=yes' >> "$GITHUB_OUTPUT"; echo "reason=${kind}_token_created" >> "$GITHUB_OUTPUT"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy payment Worker
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.TEMP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler deploy

      - name: Set Worker Razorpay secrets
        id: worker_secrets
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.TEMP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RAZORPAY_LIVE_API_KEY" | npx wrangler secret put RAZORPAY_KEY_ID
          printf '%s' "$RAZORPAY_LIVE_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET
          if [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ]; then printf '%s' "$RAZORPAY_WEBHOOK_SECRET" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET; fi

      - name: Verify live health and server tariff
        id: health
        if: steps.deploy.outcome == 'success' && steps.worker_secrets.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=no
          for i in $(seq 1 20); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me/api/payments/health?ts=$(date +%s)" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq '"service":"avc-payment-api"' && printf '%s' "$body" | grep -Fq '"razorpayConfigured":true' && printf '%s' "$body" | grep -Fq '"totalPaise":177000' && printf '%s' "$body" | grep -Fq '"wafidThirdPartyFeeIncluded":false'; then ok=yes; printf '%s' "$body" > /tmp/health.json; break; fi
            sleep 5
          done
          test "$ok" = yes

      - name: Create and verify non-charging live Razorpay Order
        id: order_test
        if: steps.health.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          case_ref="AVC-MED-LIVEVERIFY-$(date +%s)"
          response="$(curl -fsSL -X POST 'https://assignmentvenuecentre.me/api/payments/order' -H 'Origin: https://assignmentvenuecentre.me' -H 'Content-Type: application/json' --data "{\"service\":\"wafid_booking_assistance\",\"caseReference\":\"${case_ref}\"}")"
          printf '%s' "$response" > /tmp/order.json
          order_id="$(printf '%s' "$response" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('orderId',''))")"
          test -n "$order_id"
          test "$(printf '%s' "$response" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('amount',''))")" = "177000"
          test "$(printf '%s' "$response" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('currency',''))")" = "INR"
          fetched="$(curl -fsSL -u "${RAZORPAY_LIVE_API_KEY}:${RAZORPAY_LIVE_KEY_SECRET}" "https://api.razorpay.com/v1/orders/${order_id}")"
          test "$(printf '%s' "$fetched" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('amount',''))")" = "177000"
          test "$(printf '%s' "$fetched" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('receipt',''))")" = "$case_ref"

      - name: Record safe live evidence
        if: always()
        shell: bash
        run: |
          deploy='${{ steps.deploy.outcome }}'; secrets='${{ steps.worker_secrets.outcome }}'; health='${{ steps.health.outcome }}'; order='${{ steps.order_test.outcome }}'
          temp='${{ steps.temp_token.outputs.available }}'; reason='${{ steps.temp_token.outputs.reason }}'; attempts='${{ steps.temp_token.outputs.attempts }}'
          [ -n "$temp" ] || temp=no; [ -n "$reason" ] || reason=unknown; [ -n "$attempts" ] || attempts=none
          checkout=false; status=blocked_not_live
          if [ "$deploy" = success ] && [ "$secrets" = success ] && [ "$health" = success ] && [ "$order" = success ]; then checkout=true; status=success_live_checkout; fi
          trusted=false; [ "${RAZORPAY_TRUSTED_BUSINESS_ENABLED:-}" = true ] && trusted=true
          webhook_secret=no; [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ] && webhook_secret=yes
          public_key=''; [ "$checkout" = true ] && public_key="$RAZORPAY_LIVE_API_KEY"
          cat > /tmp/payment-config.js <<EOF
          window.AVC_PAYMENT_CONFIG=Object.freeze({mode:'live',checkoutEnabled:$checkout,trustedBusinessClaimEnabled:$trusted,razorpayKeyId:'$public_key',orderEndpoint:'/api/payments/order',verifyEndpoint:'/api/payments/verify',webhookManagedServerSide:true,serviceBasePaise:150000,gstRate:18,gstPaise:27000,serviceTotalPaise:177000,wafidThirdPartyFeeIncluded:false,supportEmail:'info@assignmentvenuecentre.me',supportPhone:'+91 9473286356',note:'AVC service payment ₹1,770. Wafid third-party cost is separate. Razorpay Key Secret remains server-side.'});
          EOF
          {
            echo "status=$status"; echo 'razorpay_api_auth=yes'; echo 'cloudflare_api_auth=yes'; echo "temporary_cloudflare_deploy_token=$temp"; echo "temporary_token_reason=$reason"; echo "temporary_token_attempts=$attempts";
            echo "worker_deployed=$([ "$deploy" = success ] && echo yes || echo no)"; echo "worker_razorpay_secrets_set=$([ "$secrets" = success ] && echo yes || echo no)"; echo "payment_api_health=$([ "$health" = success ] && echo yes || echo no)"; echo "live_order_creation_test=$([ "$order" = success ] && echo yes || echo no)"; echo "checkout_enabled=$checkout";
            echo 'razorpay_order_total_paise=177000'; echo 'wafid_third_party_fee_included=no'; echo "razorpay_webhook_secret_present=$webhook_secret"; echo 'razorpay_webhook_endpoint=https://assignmentvenuecentre.me/api/payments/webhook'; echo 'razorpay_webhook_subscription=merchant_dashboard_or_partner_api_required'; echo 'secret_values_exposed=no';
          } > /tmp/phase20-live-status.txt
          [ -f /tmp/health.json ] || echo '{}' > /tmp/health.json; [ -f /tmp/order.json ] || echo '{}' > /tmp/order.json
          cat /tmp/phase20-live-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razorpay-live-evidence
          path: |
            /tmp/payment-config.js
            /tmp/phase20-live-status.txt
            /tmp/health.json
            /tmp/order.json
          if-no-files-found: error

      - name: Revoke temporary Cloudflare token
        if: always() && env.TEMP_CLOUDFLARE_TOKEN_ID != ''
        continue-on-error: true
        shell: bash
        run: |
          if [ "${TEMP_CLOUDFLARE_TOKEN_KIND:-}" = account ]; then
            curl -fsSL -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/${TEMP_CLOUDFLARE_TOKEN_ID}" >/tmp/revoke.json
          else
            curl -fsSL -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/user/tokens/${TEMP_CLOUDFLARE_TOKEN_ID}" >/tmp/revoke.json
          fi
