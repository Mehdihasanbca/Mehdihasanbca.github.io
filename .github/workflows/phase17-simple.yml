name: AVC Phase 17 Brochure Simple Gate

on:
  push:
    branches: [main]
    paths:
      - phase17-simple-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply brochure integration
        run: python scripts/phase17_integrate.py
      - name: Static brochure gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,sys,xml.etree.ElementTree as ET
          r=Path('.');f=[]
          checks={'brochure.html':['Official company brochure','Mehdi Hasan','10AOVPH3197L1ZI','UDYAM-BR-10-0047094','+91 9473286356','assets/qr-apply.svg','assets/qr-website.svg','Recruitment responsibility','Print / Save as PDF'],'assets/brochure.css':['@media print','size:A4','210mm','297mm'],'assets/brochure.js':['window.print','navigator.clipboard'],'assets/site.js':['brochure.html','Company brochure'],'assets/measurement.js':['company_brochure'],'assets/seo.js':["'brochure.html':'Company Brochure'"],'media.html':['Open company brochure','brochure.html']}
          for p,needles in checks.items():
              body=(r/p).read_text(encoding='utf-8')
              for n in needles:
                  if n not in body:f.append(f'{p}: missing {n}')
          b=(r/'brochure.html').read_text(encoding='utf-8')
          if '<form' in b.lower():f.append('brochure.html: form found')
          if '9162530999' in b:f.append('brochure.html: old phone')
          for q in ['assets/qr-apply.svg','assets/qr-website.svg']:
              qbody=(r/q).read_text(encoding='utf-8')
              if '<svg' not in qbody or '<path' not in qbody:f.append(q+': invalid svg source')
          root=ET.parse('sitemap.xml').getroot();ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          if 'https://assignmentvenuecentre.me/brochure.html' not in {x.text for x in root.findall('s:url/s:loc',ns)}:f.append('sitemap: brochure missing')
          result={'status':'success' if not f else 'failed','failures':f,'warnings':[],'brochure_pages':b.count('class="brochure-page')}
          Path('phase17-static.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          if f:sys.exit(1)
          PY
      - name: Commit integrated brochure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.js assets/measurement.js assets/seo.js media.html sitemap.xml scripts/build_job_pages.py scripts/phase12_search_growth.py phase17-static.json '*.html'
          if ! git diff --cached --quiet; then git commit -m 'Integrate AVC official digital brochure'; git push; fi
      - name: Live brochure gate
        run: |
          set +e
          fail=0
          : > /tmp/live.txt
          check(){ path="$1"; marker="$2"; ok=0; for i in $(seq 1 12); do body="$(curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me${path}?phase17=$(date +%s)" 2>/dev/null || true)"; if printf '%s' "$body" | grep -Fq "$marker"; then ok=1; break; fi; sleep 8; done; if [ "$ok" -eq 1 ]; then echo "https://assignmentvenuecentre.me${path} -> 200; marker=yes" >> /tmp/live.txt; else echo "https://assignmentvenuecentre.me${path} -> marker=no" >> /tmp/live.txt; fail=$((fail+1)); fi; }
          check /brochure.html 'Official company brochure'
          check /assets/brochure.css '@media print'
          check /assets/brochure.js 'window.print'
          check /assets/qr-apply.svg '<svg'
          check /assets/qr-website.svg '<svg'
          check /media.html 'Open company brochure'
          check /assets/site.js 'Company brochure'
          check /assets/seo.js 'Company Brochure'
          check /sitemap.xml 'brochure.html'
          if [ "$fail" -eq 0 ]; then status=success; else status=failed; fi
          {
            echo 'AVC Phase 17 official digital brochure gate'
            echo "status: ${status}"
            echo 'live_checks: 9'
            echo "failures: ${fail}"
            echo 'warnings: 0'
            echo 'brochure_pages: 6'
            echo 'print_ready: A4 browser print/save-as-PDF'
            echo 'qr_assets: local SVG'
            echo 'website_data_collection: none'
            echo 'live_details:'
            cat /tmp/live.txt
            echo "checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase17-status.txt
          cat phase17-status.txt
          [ "$fail" -eq 0 ]
      - name: Commit brochure evidence
        if: always()
        run: |
          if [ ! -f phase17-status.txt ]; then exit 0; fi
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase17-status.txt phase17-static.json
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Phase 17 brochure gate'; git push; fi
