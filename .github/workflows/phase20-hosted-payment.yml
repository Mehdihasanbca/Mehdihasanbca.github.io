name: AVC Phase 20 Hosted Payment Page Gate

on:
  push:
    branches: [main]
    paths:
      - medical-booking.html
      - payment-confirmation.html
      - payment-trust.html
      - payment-refund.html
      - privacy.html
      - assets/payment-page-config.js
      - assets/payment-page.js
      - docs/RAZORPAY-HOSTED-PAYMENT-PAGE.md
      - scripts/phase20_hosted_payment_gate.py
      - .github/workflows/phase20-hosted-payment.yml
      - phase20-hosted-payment-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hosted-payment-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static hosted-payment audit
        run: python scripts/phase20_hosted_payment_gate.py

      - name: Verify production pages and assets
        shell: bash
        run: |
          set -euo pipefail
          check_live() {
            url="$1"; marker="$2"; ok=no
            for i in $(seq 1 24); do
              body="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' "${url}?avc_phase20=$(date +%s)" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq "$marker"; then ok=yes; break; fi
              sleep 5
            done
            if [ "$ok" != yes ]; then
              echo "Live check failed: $url :: $marker"
              return 1
            fi
            echo "$url -> 200 marker=yes" >> /tmp/live.txt
          }

          : > /tmp/live.txt
          check_live 'https://assignmentvenuecentre.me/medical-booking.html' 'Razorpay-hosted Payment Page'
          check_live 'https://assignmentvenuecentre.me/payment-confirmation.html' 'Razorpay payment follow-up'
          check_live 'https://assignmentvenuecentre.me/payment-trust.html' 'Razorpay Hosted Payment Page'
          check_live 'https://assignmentvenuecentre.me/privacy.html' 'Medical booking and Razorpay'
          check_live 'https://assignmentvenuecentre.me/assets/payment-page-config.js' 'AVC_RAZORPAY_PAYMENT_PAGE'
          check_live 'https://assignmentvenuecentre.me/assets/payment-page.js' 'razorpay_payment_page'

      - name: Build production status
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          data=json.loads(Path('phase20-hosted-payment-static.json').read_text(encoding='utf-8'))
          live=Path('/tmp/live.txt').read_text(encoding='utf-8').strip().splitlines()
          status=data.get('status','unknown')
          lines=[
            'AVC Phase 20.2 Razorpay Hosted Payment Page',
            f'status={status}',
            'payment_architecture=razorpay_hosted_payment_page',
            'cloudflare_worker_required=no',
            'public_key_secret_required=no',
            f"payment_page_enabled={'yes' if data.get('payment_page_enabled') else 'no'}",
            f"payment_page_url_official_host={'yes' if data.get('payment_page_url_official_host') else 'no'}",
            f"service_base_paise={data.get('service_base_paise')}",
            f"gst_rate_percent={data.get('gst_rate_percent')}",
            f"gst_paise={data.get('gst_paise')}",
            f"razorpay_payment_page_total_paise={data.get('total_paise')}",
            'wafid_third_party_fee_included=no',
            'onboarding_collection=razorpay_payment_page_custom_fields',
            'passport_url_prefill_allowed=no',
            'post_payment_redirect=https://assignmentvenuecentre.me/payment-confirmation.html',
            'payment_confirmation=razorpay_transaction_record_reconciliation',
            'screenshot_alone_is_confirmation=no',
            f'live_checks={len(live)}',
            'failures=0',
            f"warnings={len(data.get('warnings') or [])}",
            'secret_values_exposed=no',
            f"checked_at_utc={time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}",
            'live_details:',
            *live,
          ]
          Path('phase20-hosted-payment-status.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(Path('phase20-hosted-payment-status.txt').read_text(encoding='utf-8'))
          PY

      - name: Commit gate evidence
        run: |
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-hosted-payment-static.json phase20-hosted-payment-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record AVC hosted Razorpay Payment Page gate'
            git push
          fi
