name: AVC Wafid Backend Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wafid-backend-readiness.yml'
      - 'wafid-backend-readiness-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_B: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_B: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe scoped Cloudflare capabilities without creating resources
        shell: bash
        run: |
          set +e
          token="${CF_TOKEN_A:-${CF_TOKEN_B:-}}"
          account_id="${CF_ACCOUNT_A:-${CF_ACCOUNT_B:-}}"
          token_present=no
          token_auth=no
          account_id_present=no
          accounts_list_access=no
          account_target_available=no
          account_source=none
          d1_list_access=no
          workers_list_access=no
          zone_access=no
          account_count=0
          d1_count=0

          if [ -n "$token" ]; then token_present=yes; echo "::add-mask::$token"; fi
          if [ -n "$account_id" ]; then
            account_id_present=yes
            account_target_available=yes
            account_source=secret
            echo "::add-mask::$account_id"
          fi

          if [ "$token_present" = yes ]; then
            token_code="$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' -H "Authorization: Bearer ${token}" 'https://api.cloudflare.com/client/v4/user/tokens/verify' || true)"
            if [ "$token_code" = 200 ] && python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/cf-token.json', encoding='utf-8'))
              raise SystemExit(0 if data.get('success') is True else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then token_auth=yes; fi
          fi

          if [ "$token_auth" = yes ] && [ "$account_target_available" = no ]; then
            accounts_code="$(curl -sS -o /tmp/cf-accounts.json -w '%{http_code}' -H "Authorization: Bearer ${token}" 'https://api.cloudflare.com/client/v4/accounts?per_page=50' || true)"
            if [ "$accounts_code" = 200 ]; then
              readarray -t account_meta < <(python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/cf-accounts.json', encoding='utf-8'))
              rows=data.get('result') or []
              print(len(rows))
              print((rows[0] or {}).get('id','') if rows else '')
          except Exception:
              print(0)
              print('')
          PY
              )
              account_count="${account_meta[0]:-0}"
              account_id="${account_meta[1]:-}"
              accounts_list_access=yes
              if [ -n "$account_id" ]; then
                account_target_available=yes
                account_source=list
                echo "::add-mask::$account_id"
              fi
            fi
          fi

          if [ "$token_auth" = yes ]; then
            zone_code="$(curl -sS -o /tmp/cf-zone.json -w '%{http_code}' -H "Authorization: Bearer ${token}" 'https://api.cloudflare.com/client/v4/zones?name=assignmentvenuecentre.me&per_page=10' || true)"
            if [ "$zone_code" = 200 ]; then
              readarray -t zone_meta < <(python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/cf-zone.json', encoding='utf-8'))
              rows=data.get('result') or []
              print('yes' if rows else 'no')
              account=(rows[0] or {}).get('account') or {} if rows else {}
              print(account.get('id',''))
          except Exception:
              print('no')
              print('')
          PY
              )
              if [ "${zone_meta[0]:-no}" = yes ]; then zone_access=yes; fi
              zone_account_id="${zone_meta[1]:-}"
              if [ "$account_target_available" = no ] && [ -n "$zone_account_id" ]; then
                account_id="$zone_account_id"
                account_target_available=yes
                account_source=zone
                echo "::add-mask::$account_id"
              fi
            fi
          fi

          if [ "$token_auth" = yes ] && [ "$account_target_available" = yes ]; then
            d1_code="$(curl -sS -o /tmp/cf-d1.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "https://api.cloudflare.com/client/v4/accounts/${account_id}/d1/database?per_page=100" || true)"
            if [ "$d1_code" = 200 ]; then
              d1_list_access=yes
              d1_count="$(python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/cf-d1.json', encoding='utf-8'))
              print(len(data.get('result') or []))
          except Exception:
              print(0)
          PY
              )"
            fi

            workers_code="$(curl -sS -o /tmp/cf-workers.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts" || true)"
            [ "$workers_code" = 200 ] && workers_list_access=yes
          fi

          d1_binding=no
          grep -Eq '^\s*\[\[d1_databases\]\]' wrangler.toml 2>/dev/null && d1_binding=yes
          medical_routes=no
          grep -Fq '/api/v1/gamca-medical/public/' worker/payment-api.js 2>/dev/null && medical_routes=yes

          status='blocked_cloudflare_capability_probe'
          if [ "$token_auth" = yes ] && [ "$account_target_available" = yes ] && [ "$d1_list_access" = yes ] && [ "$workers_list_access" = yes ] && [ "$zone_access" = yes ]; then
            status='cloudflare_runtime_capabilities_visible'
          fi

          {
            echo 'AVC Wafid backend readiness — read-only capability probe'
            echo "status=$status"
            echo "cloudflare_token_present=$token_present"
            echo "cloudflare_token_auth=$token_auth"
            echo "cloudflare_account_id_present=$account_id_present"
            echo "cloudflare_account_target_available=$account_target_available"
            echo "cloudflare_account_source=$account_source"
            echo "cloudflare_accounts_list_access=$accounts_list_access"
            echo "cloudflare_account_count=$account_count"
            echo "cloudflare_d1_list_access=$d1_list_access"
            echo "cloudflare_existing_d1_database_count=$d1_count"
            echo "cloudflare_workers_list_access=$workers_list_access"
            echo "cloudflare_zone_access=$zone_access"
            echo "current_wrangler_d1_binding=$d1_binding"
            echo "current_worker_wafid_medical_routes=$medical_routes"
            echo 'd1_write_permission=not_tested'
            echo 'resource_created=no'
            echo 'razorpay_transaction_created=no'
            echo 'candidate_data_processed=no'
            echo 'secret_values_exposed=no'
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > wafid-backend-readiness.txt
          cat wafid-backend-readiness.txt

      - name: Commit capability evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wafid-backend-readiness.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Wafid backend readiness'
            git pull --rebase
            git push
          fi
