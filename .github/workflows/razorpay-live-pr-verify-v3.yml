name: AVC Razorpay Live Deploy Verify V3

on:
  pull_request:
    branches: [main]
    paths:
      - payment-live-pr-trigger-v3.txt
      - worker/payment-api.js
      - wrangler.toml
      - .github/workflows/razorpay-live-pr-verify-v3.yml

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_LIVE_API_KEY: ${{ secrets.RAZORPAY_LIVE_API_KEY }}
      RAZORPAY_LIVE_KEY_SECRET: ${{ secrets.RAZORPAY_LIVE_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_KEY_1: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_KEY_2: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_KEY_3: ${{ secrets.CF_API_KEY }}
      CF_EMAIL_1: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_EMAIL_2: ${{ secrets.CF_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare credential mode
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          for v in "${RAZORPAY_LIVE_API_KEY:-}" "${RAZORPAY_LIVE_KEY_SECRET:-}" "${RAZORPAY_WEBHOOK_SECRET:-}" "${CF_TOKEN_1:-}" "${CF_TOKEN_2:-}" "${CF_KEY_1:-}" "${CF_KEY_2:-}" "${CF_KEY_3:-}" "${CF_EMAIL_1:-}" "${CF_EMAIL_2:-}"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          test -n "${RAZORPAY_LIVE_API_KEY:-}"; test -n "${RAZORPAY_LIVE_KEY_SECRET:-}"; [[ "$RAZORPAY_LIVE_API_KEY" == rzp_live_* ]]
          test "$(curl -sS -o /tmp/rzp-auth.json -w '%{http_code}' -u "${RAZORPAY_LIVE_API_KEY}:${RAZORPAY_LIVE_KEY_SECRET}" 'https://api.razorpay.com/v1/orders?count=1')" = "200"
          selected=''; mode=''; alias=''; account_id=''
          for pair in "CLOUDFLARE_API_TOKEN:${CF_TOKEN_1:-}" "CF_API_TOKEN:${CF_TOKEN_2:-}"; do
            name="${pair%%:*}"; value="${pair#*:}"; [ -n "$value" ] || continue
            code="$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' -H "Authorization: Bearer $value" 'https://api.cloudflare.com/client/v4/user/tokens/verify' || true)"
            [ "$code" = 200 ] || continue
            accounts="$(curl -sS -H "Authorization: Bearer $value" 'https://api.cloudflare.com/client/v4/accounts' || true)"
            zones="$(curl -sS -H "Authorization: Bearer $value" 'https://api.cloudflare.com/client/v4/zones?name=assignmentvenuecentre.me' || true)"
            account_id="$(printf '%s' "$accounts" | python -c "import sys,json;\ntry:d=json.load(sys.stdin);r=d.get('result') or [];print(r[0].get('id','') if r else '')\nexcept:print('')" 2>/dev/null)"
            if [ -z "$account_id" ]; then account_id="$(printf '%s' "$zones" | python -c "import sys,json;\ntry:d=json.load(sys.stdin);r=d.get('result') or [];print(((r[0].get('account') or {}).get('id','')) if r else '')\nexcept:print('')" 2>/dev/null)"; fi
            if [ -n "$account_id" ]; then selected="$value"; mode='bearer'; alias="$name"; break; fi
          done
          if [ -z "$selected" ]; then
            email="${CF_EMAIL_1:-${CF_EMAIL_2:-}}"
            for pair in "CLOUDFLARE_API_KEY:${CF_KEY_1:-}" "CLOUDFLARE_GLOBAL_API_KEY:${CF_KEY_2:-}" "CF_API_KEY:${CF_KEY_3:-}"; do
              name="${pair%%:*}"; value="${pair#*:}"; [ -n "$value" ] || continue; [ -n "$email" ] || continue
              accounts="$(curl -sS -H "X-Auth-Email: $email" -H "X-Auth-Key: $value" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts' || true)"
              zones="$(curl -sS -H "X-Auth-Email: $email" -H "X-Auth-Key: $value" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=assignmentvenuecentre.me' || true)"
              account_id="$(printf '%s' "$accounts" | python -c "import sys,json;\ntry:d=json.load(sys.stdin);r=d.get('result') or [];print(r[0].get('id','') if r else '')\nexcept:print('')" 2>/dev/null)"
              if [ -z "$account_id" ]; then account_id="$(printf '%s' "$zones" | python -c "import sys,json;\ntry:d=json.load(sys.stdin);r=d.get('result') or [];print(((r[0].get('account') or {}).get('id','')) if r else '')\nexcept:print('')" 2>/dev/null)"; fi
              if [ -n "$account_id" ]; then selected="$value"; mode='global'; alias="$name"; echo "CF_SELECTED_EMAIL=$email" >> "$GITHUB_ENV"; break; fi
            done
          fi
          test -n "$selected"; test -n "$account_id"
          echo "::add-mask::$selected"; echo "::add-mask::$account_id"
          echo "CF_SELECTED_SECRET=$selected" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CF_AUTH_MODE=$mode" >> "$GITHUB_ENV"
          echo "CF_AUTH_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "auth_mode=$mode" >> "$GITHUB_OUTPUT"; echo "auth_alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy payment Worker
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ "$CF_AUTH_MODE" = bearer ]; then
            export CLOUDFLARE_API_TOKEN="$CF_SELECTED_SECRET"; unset CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL || true
          else
            unset CLOUDFLARE_API_TOKEN || true; export CLOUDFLARE_API_KEY="$CF_SELECTED_SECRET"; export CLOUDFLARE_EMAIL="$CF_SELECTED_EMAIL"
          fi
          export CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log

      - name: Set Worker Razorpay secrets
        id: worker_secrets
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CF_AUTH_MODE" = bearer ]; then export CLOUDFLARE_API_TOKEN="$CF_SELECTED_SECRET"; unset CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL || true; else unset CLOUDFLARE_API_TOKEN || true; export CLOUDFLARE_API_KEY="$CF_SELECTED_SECRET"; export CLOUDFLARE_EMAIL="$CF_SELECTED_EMAIL"; fi
          export CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$RAZORPAY_LIVE_API_KEY" | npx wrangler secret put RAZORPAY_KEY_ID
          printf '%s' "$RAZORPAY_LIVE_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET
          if [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ]; then printf '%s' "$RAZORPAY_WEBHOOK_SECRET" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET; fi

      - name: Verify health and create live Order
        id: verify_live
        if: steps.deploy.outcome == 'success' && steps.worker_secrets.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ok=no
          for i in $(seq 1 20); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me/api/payments/health?ts=$(date +%s)" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq '"service":"avc-payment-api"' && printf '%s' "$body" | grep -Fq '"razorpayConfigured":true' && printf '%s' "$body" | grep -Fq '"totalPaise":177000'; then ok=yes; printf '%s' "$body" > /tmp/health.json; break; fi
            sleep 5
          done
          test "$ok" = yes
          case_ref="AVC-MED-LIVEVERIFY-$(date +%s)"
          response="$(curl -fsSL -X POST 'https://assignmentvenuecentre.me/api/payments/order' -H 'Origin: https://assignmentvenuecentre.me' -H 'Content-Type: application/json' --data "{\"service\":\"wafid_booking_assistance\",\"caseReference\":\"${case_ref}\"}")"
          printf '%s' "$response" > /tmp/order.json
          order_id="$(printf '%s' "$response" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('orderId',''))")"
          test -n "$order_id"; test "$(printf '%s' "$response" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('amount',''))")" = "177000"
          fetched="$(curl -fsSL -u "${RAZORPAY_LIVE_API_KEY}:${RAZORPAY_LIVE_KEY_SECRET}" "https://api.razorpay.com/v1/orders/${order_id}")"
          test "$(printf '%s' "$fetched" | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('receipt',''))")" = "$case_ref"

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          deploy='${{ steps.deploy.outcome }}'; secrets='${{ steps.worker_secrets.outcome }}'; verify='${{ steps.verify_live.outcome }}'; checkout=false; status=blocked_not_live
          if [ "$deploy" = success ] && [ "$secrets" = success ] && [ "$verify" = success ]; then checkout=true; status=success_live_checkout; fi
          webhook=no; [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ] && webhook=yes
          {
            echo "status=$status"; echo "cloudflare_auth_mode=${CF_AUTH_MODE:-unknown}"; echo "cloudflare_secret_alias=${CF_AUTH_ALIAS:-unknown}"; echo "worker_deployed=$([ "$deploy" = success ] && echo yes || echo no)"; echo "worker_razorpay_secrets_set=$([ "$secrets" = success ] && echo yes || echo no)"; echo "payment_api_and_live_order_test=$([ "$verify" = success ] && echo yes || echo no)"; echo "checkout_enabled=$checkout"; echo 'razorpay_order_total_paise=177000'; echo 'wafid_third_party_fee_included=no'; echo "razorpay_webhook_secret_present=$webhook"; echo 'secret_values_exposed=no';
          } > /tmp/phase20-live-status.txt
          [ -f /tmp/health.json ] || echo '{}' > /tmp/health.json; [ -f /tmp/order.json ] || echo '{}' > /tmp/order.json; [ -f /tmp/wrangler-deploy.log ] || echo 'not-run' > /tmp/wrangler-deploy.log
          cat /tmp/phase20-live-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razorpay-live-evidence-v3
          path: |
            /tmp/phase20-live-status.txt
            /tmp/health.json
            /tmp/order.json
            /tmp/wrangler-deploy.log
          if-no-files-found: error
