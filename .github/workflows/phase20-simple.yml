name: AVC Phase 20 Payment Simple Gate

on:
  push:
    branches: [main]
    paths:
      - phase20-simple-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate Phase 20
        run: python scripts/phase20_integrate.py
      - name: Static safety check
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,sys,xml.etree.ElementTree as ET
          f=[];r=Path('.')
          checks={
            'payment-trust.html':['Payment Trust Center','Live payment remains disabled','Razorpay Trusted Business','Money Back Promise'],
            'medical-booking.html':['Operator-assisted','Official Wafid / third-party booking cost','wafid.com/en/book-appointment/'],
            'payment-refund.html':['Payment & Refund Policy','Duplicate payment','No self-created “money back” badge'],
            'assets/payment-config.js':["checkoutEnabled:false","trustedBusinessClaimEnabled:false","razorpayKeyId:''","orderEndpoint:''","verifyEndpoint:''"],
            'assets/payment.js':['orderEndpoint','verifyEndpoint','razorpay_signature','checkout.razorpay.com/v1/checkout.js'],
            'resources.html':['Wafid Medical Booking Assistance','Payment Trust Center'],
            'assets/site.js':['medical-booking.html','payment-trust.html'],
            'assets/measurement.js':['medical_booking','payment_trust','payment_refund'],
            'assets/seo.js':['Wafid Medical Booking Assistance','Payment Trust Center','Payment & Refund Policy']
          }
          for p,ns in checks.items():
              b=(r/p).read_text(encoding='utf-8')
              for n in ns:
                  if n not in b:f.append(f'{p}: missing {n}')
          cfg=(r/'assets/payment-config.js').read_text(encoding='utf-8')
          if 'rzp_live_' in cfg or 'rzp_test_' in cfg:f.append('payment-config.js: Razorpay key unexpectedly configured')
          for p in ['payment-trust.html','medical-booking.html','payment-refund.html']:
              b=(r/p).read_text(encoding='utf-8').lower()
              if '<form' in b or '<input' in b:f.append(f'{p}: static payment/medical form found')
              if '9162530999' in b:f.append(f'{p}: obsolete phone')
          root=ET.parse('sitemap.xml').getroot();ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs={x.text for x in root.findall('s:url/s:loc',ns)}
          for u in ['https://assignmentvenuecentre.me/medical-booking.html','https://assignmentvenuecentre.me/payment-trust.html','https://assignmentvenuecentre.me/payment-refund.html']:
              if u not in locs:f.append('sitemap missing '+u)
          cards=(r/'resources.html').read_text(encoding='utf-8').count('data-resource-card')
          if cards!=15:f.append(f'resources card count {cards}, expected 15')
          out={'status':'success' if not f else 'failed','failures':f,'warnings':[],'resource_cards':cards,'checkout_enabled':False,'razorpay_key_id_configured':False,'trusted_business_claim':False,'money_back_promise_claim':False}
          Path('phase20-static.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          if f:sys.exit(1)
          PY
      - name: Commit Phase 20 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.js assets/measurement.js assets/seo.js resources.html sitemap.xml scripts/phase12_search_growth.py scripts/build_job_pages.py phase20-static.json '*.html'
          if ! git diff --cached --quiet; then git commit -m 'Integrate AVC Phase 20 payment foundation'; git push; fi
      - name: Live Phase 20 gate
        run: |
          set +e
          fail=0
          : > /tmp/live.txt
          check(){ path="$1"; marker="$2"; ok=0; for i in $(seq 1 15); do body="$(curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me${path}?phase20=$(date +%s)" 2>/dev/null || true)"; if printf '%s' "$body" | grep -Fq "$marker"; then ok=1; break; fi; sleep 8; done; if [ "$ok" -eq 1 ]; then echo "https://assignmentvenuecentre.me${path} -> 200; marker=yes" >> /tmp/live.txt; else echo "https://assignmentvenuecentre.me${path} -> marker=no" >> /tmp/live.txt; fail=$((fail+1)); fi; }
          check /payment-trust.html 'Payment Trust Center'
          check /medical-booking.html 'Operator-assisted'
          check /payment-refund.html 'Payment & Refund Policy'
          check /assets/payment.css 'payment-disabled'
          check /assets/payment.js 'verifyEndpoint'
          check /assets/payment-config.js 'checkoutEnabled:false'
          check /resources.html 'Wafid Medical Booking Assistance'
          check /assets/site.js 'medical-booking.html'
          check /assets/seo.js 'Payment Trust Center'
          check /sitemap.xml 'payment-trust.html'
          if [ "$fail" -eq 0 ]; then status=success; else status=failed; fi
          {
            echo 'AVC Phase 20 payment trust and Wafid medical foundation gate'
            echo "status: ${status}"
            echo 'live_checks: 10'
            echo "failures: ${fail}"
            echo 'warnings: 0'
            echo 'secure_checkout: disabled_pending_backend'
            echo 'razorpay_key_id: not_configured'
            echo 'razorpay_key_secret_public: no'
            echo 'trusted_business_claim: not_enabled'
            echo 'money_back_promise_claim: not_enabled'
            echo 'wafid_booking_mode: operator_assisted_manual_official_wafid'
            echo 'website_payment_data_collection: none'
            echo 'live_details:'
            cat /tmp/live.txt
            echo "checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-status.txt
          cat phase20-status.txt
          [ "$fail" -eq 0 ]
      - name: Commit Phase 20 evidence
        if: always()
        run: |
          if [ ! -f phase20-status.txt ]; then exit 0; fi
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-status.txt phase20-static.json
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Phase 20 payment foundation gate'; git push; fi
