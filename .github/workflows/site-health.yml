name: AVC Public Website Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - health-trigger.txt

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live AVC pages
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://assignmentvenuecentre.me'
          status=success
          detail='Core AVC public pages are reachable with expected company content'

          check_page(){
            local slug="$1" marker="$2" file="/tmp/${slug:-home}.html"
            local url="${BASE}/${slug}"
            [ -z "$slug" ] && url="${BASE}/"
            local code
            code="$(curl -sS -L -o "$file" -w '%{http_code}' --connect-timeout 15 --max-time 35 "$url" || true)"
            local present=no
            grep -qi "$marker" "$file" 2>/dev/null && present=yes
            echo "${code}|${present}"
          }

          IFS='|' read -r home_code home_brand <<<"$(check_page '' 'Assignment Venue Center')"
          IFS='|' read -r about_code about_founder <<<"$(check_page 'about.html' 'Mehdi Hasan')"
          IFS='|' read -r candidates_code candidates_marker <<<"$(check_page 'candidates.html' 'candidate journey')"
          IFS='|' read -r employers_code employers_marker <<<"$(check_page 'employers.html' 'manpower support')"
          IFS='|' read -r partners_code partners_marker <<<"$(check_page 'partners.html' 'sourcing partnership')"

          for pair in "$home_code:$home_brand" "$about_code:$about_founder" "$candidates_code:$candidates_marker" "$employers_code:$employers_marker" "$partners_code:$partners_marker"; do
            code="${pair%%:*}"; marker="${pair##*:}"
            if [ "$code" != 200 ] || [ "$marker" != yes ]; then status=failed; detail='One or more live AVC page checks failed'; fi
          done

          {
            echo 'AVC public website health'
            echo "status: ${status}"
            echo "detail: ${detail}"
            echo "homepage_http: ${home_code}; expected_content: ${home_brand}"
            echo "about_http: ${about_code}; expected_content: ${about_founder}"
            echo "candidates_http: ${candidates_code}; expected_content: ${candidates_marker}"
            echo "employers_http: ${employers_code}; expected_content: ${employers_marker}"
            echo "partners_http: ${partners_code}; expected_content: ${partners_marker}"
            echo "checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > site-health-status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-health-status.txt
          if ! git diff --cached --quiet; then git commit -m 'Record AVC public website health'; git push; fi
          [ "$status" = success ]
