name: AVC Phase 20.1 Razorpay Live Activation

on:
  push:
    branches: [main]
    paths:
      - phase20-live-trigger.txt
      - worker/payment-api.js
      - wrangler.toml
      - .github/workflows/phase20-live-razorpay.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avc-phase20-live-razorpay
  cancel-in-progress: false

env:
  RZP_ID_A: ${{ secrets.RAZORPAY_KEY_ID }}
  RZP_ID_B: ${{ secrets.RAZORPAY_API_KEY }}
  RZP_ID_C: ${{ secrets.RAZORPAY_API_KEY_ID }}
  RZP_SECRET_A: ${{ secrets.RAZORPAY_KEY_SECRET }}
  RZP_SECRET_B: ${{ secrets.RAZORPAY_API_SECRET }}
  RZP_SECRET_C: ${{ secrets.RAZORPAY_API_KEY_SECRET }}
  RZP_COMBINED: ${{ secrets.RAZORPAY_API }}
  RZP_WEBHOOK: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
  CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_TOKEN_B: ${{ secrets.CF_API_TOKEN }}
  CF_ACCOUNT_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_ACCOUNT_B: ${{ secrets.CF_ACCOUNT_ID }}
  TARIFF_A: ${{ secrets.AVC_MEDICAL_TOTAL_PAISE }}
  TARIFF_B: ${{ secrets.MEDICAL_TOTAL_PAISE }}
  TARIFF_VAR: ${{ vars.AVC_MEDICAL_TOTAL_PAISE }}
  TRUSTED_FLAG: ${{ vars.RAZORPAY_TRUSTED_BUSINESS_ENABLED }}

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve secure configuration without exposing values
        shell: bash
        run: |
          set -euo pipefail
          RZP_ID="${RZP_ID_A:-${RZP_ID_B:-${RZP_ID_C:-}}}"
          RZP_SECRET="${RZP_SECRET_A:-${RZP_SECRET_B:-${RZP_SECRET_C:-}}}"
          if { [ -z "$RZP_ID" ] || [ -z "$RZP_SECRET" ]; } && [[ "${RZP_COMBINED:-}" == *:* ]]; then
            COMBINED_ID="${RZP_COMBINED%%:*}"
            COMBINED_SECRET="${RZP_COMBINED#*:}"
            [ -n "$RZP_ID" ] || RZP_ID="$COMBINED_ID"
            [ -n "$RZP_SECRET" ] || RZP_SECRET="$COMBINED_SECRET"
          fi
          CF_TOKEN="${CF_TOKEN_A:-${CF_TOKEN_B:-}}"
          CF_ACCOUNT="${CF_ACCOUNT_A:-${CF_ACCOUNT_B:-}}"
          TARIFF="${TARIFF_A:-${TARIFF_B:-${TARIFF_VAR:-}}}"
          for value in "$RZP_ID" "$RZP_SECRET" "$RZP_WEBHOOK" "$CF_TOKEN" "$CF_ACCOUNT"; do [ -z "$value" ] || echo "::add-mask::$value"; done
          {
            echo "RZP_ID=$RZP_ID"
            echo "RZP_SECRET=$RZP_SECRET"
            echo "CF_TOKEN=$CF_TOKEN"
            echo "CF_ACCOUNT=$CF_ACCOUNT"
            echo "TARIFF=$TARIFF"
          } >> "$GITHUB_ENV"
          if [[ "$RZP_ID" == rzp_live_* ]]; then echo 'RZP_MODE=live' >> "$GITHUB_ENV"; elif [[ "$RZP_ID" == rzp_test_* ]]; then echo 'RZP_MODE=test' >> "$GITHUB_ENV"; else echo 'RZP_MODE=unknown' >> "$GITHUB_ENV"; fi

      - name: Validate activation prerequisites
        shell: bash
        run: |
          set +e
          rzpid=no; rzpsecret=no; cf=no; tariff=no; webhook=no
          [ -n "${RZP_ID:-}" ] && rzpid=yes
          [ -n "${RZP_SECRET:-}" ] && rzpsecret=yes
          [ -n "${CF_TOKEN:-}" ] && [ -n "${CF_ACCOUNT:-}" ] && cf=yes
          [[ "${TARIFF:-}" =~ ^[1-9][0-9]*$ ]] && tariff=yes
          [ -n "${RZP_WEBHOOK:-}" ] && webhook=yes
          {
            echo "razorpay_key_id_present=$rzpid"
            echo "razorpay_key_secret_present=$rzpsecret"
            echo "razorpay_mode=${RZP_MODE:-unknown}"
            echo "cloudflare_deploy_credentials_present=$cf"
            echo "medical_total_paise_configured=$tariff"
            echo "razorpay_webhook_secret_present=$webhook"
          } > /tmp/prereq.txt
          cat /tmp/prereq.txt

      - name: Install Wrangler
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        run: npm install --no-save wrangler@4

      - name: Deploy payment API and secrets
        id: deploy
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.RZP_ID != '' && env.RZP_SECRET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$RZP_ID" | npx wrangler secret put RAZORPAY_KEY_ID >/dev/null
          printf '%s' "$RZP_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET >/dev/null
          if [[ "${TARIFF:-}" =~ ^[1-9][0-9]*$ ]]; then printf '%s' "$TARIFF" | npx wrangler secret put MEDICAL_TOTAL_PAISE >/dev/null; fi
          if [ -n "${RZP_WEBHOOK:-}" ]; then printf '%s' "$RZP_WEBHOOK" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET >/dev/null; fi
          echo 'deployed=yes' >> "$GITHUB_OUTPUT"

      - name: Probe same-origin payment API
        id: probe
        shell: bash
        run: |
          set +e
          ok=no
          body=''
          for i in $(seq 1 12); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me/api/payments/health?ts=$(date +%s)" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq '"service":"avc-payment-api"'; then ok=yes; break; fi
            sleep 8
          done
          echo "health=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = yes ]; then
            printf '%s' "$body" > /tmp/health.json
          else
            echo '{}' > /tmp/health.json
          fi

      - name: Generate public checkout configuration safely
        shell: bash
        run: |
          set -euo pipefail
          health="${{ steps.probe.outputs.health }}"
          enabled=false
          if [ "$health" = yes ] && [ "${RZP_MODE:-unknown}" = live ] && [[ "${TARIFF:-}" =~ ^[1-9][0-9]*$ ]]; then enabled=true; fi
          trusted=false
          if [ "${TRUSTED_FLAG:-}" = true ]; then trusted=true; fi
          key=''
          if [ "$enabled" = true ]; then key="$RZP_ID"; fi
          cat > assets/payment-config.js <<EOF
          window.AVC_PAYMENT_CONFIG=Object.freeze({
            mode:'${RZP_MODE:-unknown}',
            checkoutEnabled:${enabled},
            trustedBusinessClaimEnabled:${trusted},
            razorpayKeyId:'${key}',
            orderEndpoint:'/api/payments/order',
            verifyEndpoint:'/api/payments/verify',
            webhookManagedServerSide:true,
            supportEmail:'info@assignmentvenuecentre.me',
            supportPhone:'+91 9473286356',
            note:'Public configuration only. Razorpay Key Secret and webhook secret remain server-side.'
          });
          EOF
          echo "CHECKOUT_ENABLED=$enabled" >> "$GITHUB_ENV"

      - name: Write activation evidence
        shell: bash
        run: |
          set +e
          health="${{ steps.probe.outputs.health }}"
          deploy=no
          [ "${{ steps.deploy.outputs.deployed }}" = yes ] && deploy=yes
          tariff=no; [[ "${TARIFF:-}" =~ ^[1-9][0-9]*$ ]] && tariff=yes
          webhook=no; [ -n "${RZP_WEBHOOK:-}" ] && webhook=yes
          trusted=no; [ "${TRUSTED_FLAG:-}" = true ] && trusted=yes
          {
            echo 'AVC Phase 20.1 Razorpay live activation'
            cat /tmp/prereq.txt
            echo "worker_deployed=$deploy"
            echo "payment_api_health=$health"
            echo "checkout_enabled=${CHECKOUT_ENABLED:-false}"
            echo "trusted_business_claim_enabled=$trusted"
            echo "webhook_verification_configured=$webhook"
            echo 'key_secret_public=no'
            if [ "${CHECKOUT_ENABLED:-false}" = true ]; then echo 'status=success_live_checkout'; else echo 'status=blocked_not_live'; fi
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-live-status.txt
          cat phase20-live-status.txt

      - name: Commit public config and status
        if: always()
        shell: bash
        run: |
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/payment-config.js phase20-live-status.txt
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Razorpay live activation'; git push; fi
