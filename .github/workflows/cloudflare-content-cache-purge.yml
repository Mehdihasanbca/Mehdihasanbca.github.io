name: AVC Targeted Content Cache Purge

on:
  push:
    branches: [main]
    paths:
      - 'cache-purge-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Purge targeted Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN=assignmentvenuecentre.me
          API=https://api.cloudflare.com/client/v4
          TOKEN="$(python - <<'PY'
          import os
          s=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          if s.lower().startswith('bearer '): s=s[7:].strip()
          if len(s)>=2 and s[0]==s[-1] and s[0] in ('\"', "'"): s=s[1:-1].strip()
          print(s,end='')
          PY
          )"
          status=failed
          detail='token or zone unavailable'
          if [ -n "$TOKEN" ]; then
            zone_json="$(curl -sS --connect-timeout 15 --max-time 30 -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' "${API}/zones?name=${DOMAIN}&status=active" || true)"
            zone_id="$(jq -r '.result[0].id // empty' <<<"$zone_json" 2>/dev/null || true)"
            if [ -n "$zone_id" ]; then
              payload='{"files":["https://assignmentvenuecentre.me/robots.txt","https://assignmentvenuecentre.me/sitemap.xml","https://assignmentvenuecentre.me/sitemap-jobs.xml","https://assignmentvenuecentre.me/jobs.html","https://assignmentvenuecentre.me/data/jobs.json"]}'
              purge_json="$(curl -sS --connect-timeout 15 --max-time 30 -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data "$payload" "${API}/zones/${zone_id}/purge_cache" || true)"
              ok="$(jq -r '.success // false' <<<"$purge_json" 2>/dev/null || echo false)"
              if [ "$ok" = true ]; then
                status=success
                detail='targeted public content cache purged'
              else
                detail="$(jq -r '[.errors[]?.message] | join("; ")' <<<"$purge_json" 2>/dev/null || echo 'Cloudflare purge request failed')"
              fi
            fi
          fi
          {
            echo 'AVC targeted content cache purge'
            echo "status: ${status}"
            echo "detail: ${detail}"
            echo "checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > cache-purge-status.txt
          cat cache-purge-status.txt
          if [ "$status" != success ]; then exit 1; fi

      - name: Commit safe purge status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache-purge-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record AVC targeted cache purge'
            git push
          fi
