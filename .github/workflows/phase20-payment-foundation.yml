name: AVC Phase 20 Payment Foundation

on:
  push:
    branches: [main]
    paths:
      - phase20-trigger.txt
      - scripts/phase20_integrate.py
      - assets/payment.css
      - assets/payment.js
      - assets/payment-config.js
      - medical-booking.html
      - payment-trust.html
      - payment-refund.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avc-phase20-payment-foundation
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate payment trust and medical booking
        run: python scripts/phase20_integrate.py

      - name: Static payment safety gate
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json,sys,re
          r=Path('.'); failures=[]; warnings=[]
          checks={
            'payment-trust.html':['Payment Trust Center','Pay securely with Razorpay','checkout is not activated yet','Razorpay Trusted Business','Money Back Promise'],
            'medical-booking.html':['Wafid / GAMCA support','Operator-assisted','Official Wafid / third-party booking cost','Pay securely with Razorpay','wafid.com/en/book-appointment/'],
            'payment-refund.html':['Payment & Refund Policy','Duplicate payment','No self-created “money back” badge','third-party amount'],
            'assets/payment.css':['payment-hero','payment-disabled','fee-card'],
            'assets/payment.js':['orderEndpoint','verifyEndpoint','razorpay_signature','server-side','checkout.razorpay.com/v1/checkout.js'],
            'assets/payment-config.js':["checkoutEnabled:false","trustedBusinessClaimEnabled:false","razorpayKeyId:''","orderEndpoint:''","verifyEndpoint:''"],
            'assets/measurement.js':['medical_booking','payment_trust','payment_refund'],
            'assets/seo.js':["'medical-booking.html':'Wafid Medical Booking Assistance'","'payment-trust.html':'Payment Trust Center'","'payment-refund.html':'Payment & Refund Policy'"],
            'resources.html':['Wafid Medical Booking Assistance','Payment Trust Center']
          }
          for p,needles in checks.items():
              body=(r/p).read_text(encoding='utf-8')
              for n in needles:
                  if n not in body: failures.append(f'{p}: missing {n}')
          cfg=(r/'assets/payment-config.js').read_text(encoding='utf-8')
          if re.search(r'rzp_(live|test)_[A-Za-z0-9]+',cfg): failures.append('payment-config.js: Razorpay key must remain unset in foundation release')
          if re.search(r'key[_ -]?secret\s*[:=]\s*[\'\"][^\'\"]+',cfg,re.I): failures.append('payment-config.js: possible secret value exposed')
          for p in ['payment-trust.html','medical-booking.html','payment-refund.html']:
              body=(r/p).read_text(encoding='utf-8').lower()
              if '<input' in body or '<form' in body: failures.append(f'{p}: payment/medical personal-data form not allowed in static foundation')
              if '9162530999' in body: failures.append(f'{p}: obsolete phone')
          root=ET.parse('sitemap.xml').getroot();ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs={x.text for x in root.findall('s:url/s:loc',ns)}
          for u in ['https://assignmentvenuecentre.me/medical-booking.html','https://assignmentvenuecentre.me/payment-trust.html','https://assignmentvenuecentre.me/payment-refund.html']:
              if u not in locs: failures.append('sitemap missing '+u)
          resources=(r/'resources.html').read_text(encoding='utf-8')
          cards=resources.count('data-resource-card')
          if cards!=15: failures.append(f'resources.html: expected 15 cards after Phase 20, found {cards}')
          result={'status':'success' if not failures else 'failed','failures':failures,'warnings':warnings,'resource_cards':cards,'checkout_enabled':False,'trusted_business_claim':False,'money_back_promise_claim':False,'website_payment_data_collection':'none'}
          Path('phase20-static.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          if failures: sys.exit(1)
          PY

      - name: Commit Phase 20 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.js assets/measurement.js assets/seo.js resources.html sitemap.xml scripts/phase12_search_growth.py scripts/build_job_pages.py phase20-static.json '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate AVC Phase 20 payment foundation'
            git push
          fi

      - name: Live payment foundation gate
        run: |
          set +e
          fail=0
          : > /tmp/live.txt
          check(){
            path="$1"; marker="$2"; ok=0
            for i in $(seq 1 15); do
              sep='?'; [[ "$path" == *'?'* ]] && sep='&'
              body="$(curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me${path}${sep}phase20=$(date +%s)" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq "$marker"; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" -eq 1 ]; then echo "https://assignmentvenuecentre.me${path} -> 200; marker=yes" >> /tmp/live.txt; else echo "https://assignmentvenuecentre.me${path} -> marker=no" >> /tmp/live.txt; fail=$((fail+1)); fi
          }
          check /payment-trust.html 'Payment Trust Center'
          check /medical-booking.html 'Operator-assisted'
          check /payment-refund.html 'Payment & Refund Policy'
          check /assets/payment.css 'payment-disabled'
          check /assets/payment.js 'verifyEndpoint'
          check /assets/payment-config.js 'checkoutEnabled:false'
          check /resources.html 'Wafid Medical Booking Assistance'
          check /assets/site.js 'medical-booking.html'
          check /assets/seo.js 'Payment Trust Center'
          check /sitemap.xml 'payment-trust.html'
          if [ "$fail" -eq 0 ]; then status=success; else status=failed; fi
          {
            echo 'AVC Phase 20 payment trust and Wafid medical foundation gate'
            echo "status: ${status}"
            echo 'live_checks: 10'
            echo "failures: ${fail}"
            echo 'warnings: 0'
            echo 'secure_checkout: disabled_pending_backend'
            echo 'razorpay_key_id: not_configured'
            echo 'razorpay_key_secret_public: no'
            echo 'trusted_business_claim: not_enabled'
            echo 'money_back_promise_claim: not_enabled'
            echo 'wafid_booking_mode: operator_assisted_manual_official_wafid'
            echo 'website_payment_data_collection: none'
            echo 'live_details:'
            cat /tmp/live.txt
            echo "checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-status.txt
          cat phase20-status.txt
          [ "$fail" -eq 0 ]

      - name: Commit Phase 20 evidence
        if: always()
        run: |
          if [ ! -f phase20-status.txt ]; then exit 0; fi
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-status.txt phase20-static.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record AVC Phase 20 payment foundation gate'
            git push
          fi
