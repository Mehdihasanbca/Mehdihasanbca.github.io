name: AVC Phase 15 Simple Gate

on:
  push:
    branches: [main]
    paths:
      - phase15-simple-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 15 integration
        run: |
          python scripts/phase15_integrate.py
          python scripts/build_job_pages.py
      - name: Validate Phase 15 static routes
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json, sys
          r=Path('.')
          failures=[]
          required={
            'candidates.html':['apply.html?source=candidates','measurement.js?v=20260807-p15'],
            'employers.html':['employer-requirement.html?source=employers','measurement.js?v=20260807-p15'],
            'partners.html':['partner-enquiry.html?source=partners','measurement.js?v=20260807-p15'],
            'jobs.html':['apply.html?source=jobs','jobs.js?v=20260807-p15','measurement.js?v=20260807-p15'],
            'assets/jobs.js':['apply.html?source=jobs&job='],
            'scripts/build_job_pages.py':['apply.html?source=vacancy&job='],
            'assets/conversion.js':['data/jobs.json','candidate_form_open'],
            'assets/measurement.js':['apply_gateway','employer_requirement','partner_enquiry'],
          }
          for p,needles in required.items():
            body=(r/p).read_text(encoding='utf-8')
            for n in needles:
              if n not in body: failures.append(f'{p}: missing {n}')
          for p in ['employer-requirement.html','partner-enquiry.html']:
            if '<form' in (r/p).read_text(encoding='utf-8').lower(): failures.append(f'{p}: fake form found')
          sm=ET.parse(r/'sitemap.xml').getroot(); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs={x.text for x in sm.findall('s:url/s:loc',ns)}
          for u in ['https://assignmentvenuecentre.me/employer-requirement.html','https://assignmentvenuecentre.me/partner-enquiry.html']:
            if u not in locs: failures.append('sitemap missing '+u)
          if 'https://assignmentvenuecentre.me/apply.html' in locs: failures.append('apply.html must stay out of sitemap')
          Path('phase15-static.json').write_text(json.dumps({'status':'success' if not failures else 'failed','failures':failures},indent=2),encoding='utf-8')
          if failures:
            print('\n'.join(failures));sys.exit(1)
          PY
      - name: Commit integrated routes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidates.html employers.html partners.html jobs.html assets/seo.js sitemap.xml sitemap-jobs.xml phase15-static.json
          if [ -d vacancies ]; then git add -A vacancies; fi
          if ! git diff --cached --quiet; then git commit -m 'Integrate AVC Phase 15 conversion routes'; git push; fi
      - name: Live Phase 15 gate
        run: |
          set +e
          fail=0
          : > /tmp/live.txt
          check(){
            path="$1"; marker="$2"; ok=0
            for i in $(seq 1 12); do
              body="$(curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me${path}?phase15=$(date +%s)" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq "$marker"; then ok=1; break; fi
              sleep 8
            done
            if [ "$ok" -eq 1 ]; then echo "https://assignmentvenuecentre.me${path} -> 200; marker=yes" >> /tmp/live.txt; else echo "https://assignmentvenuecentre.me${path} -> marker=no" >> /tmp/live.txt; fail=$((fail+1)); fi
          }
          check /apply.html 'Official AVC application gateway'
          check /employer-requirement.html 'Employer requirement intake'
          check /partner-enquiry.html 'Recruitment partner enquiry'
          check /candidates.html 'apply.html?source=candidates'
          check /employers.html 'employer-requirement.html?source=employers'
          check /partners.html 'partner-enquiry.html?source=partners'
          check /jobs.html 'apply.html?source=jobs'
          check /assets/jobs.js 'apply.html?source=jobs&job='
          check /assets/conversion.js 'candidate_form_open'
          check /assets/measurement.js 'apply_gateway'
          check /sitemap.xml 'employer-requirement.html'
          check /sitemap.xml 'partner-enquiry.html'
          if [ "$fail" -eq 0 ]; then status=success; else status=failed; fi
          {
            echo 'AVC Phase 15 conversion flow gate'
            echo "status: ${status}"
            echo 'live_checks: 12'
            echo "failures: ${fail}"
            echo 'warnings: 0'
            echo 'candidate_submission: official external form only'
            echo 'employer_intake: official email only'
            echo 'partner_intake: official email only'
            echo 'website_data_collection: none in Phase 15'
            echo 'live_details:'
            cat /tmp/live.txt
            echo "checked_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase15-status.txt
          cat phase15-status.txt
          [ "$fail" -eq 0 ]
      - name: Commit Phase 15 evidence
        if: always()
        run: |
          if [ ! -f phase15-status.txt ]; then exit 0; fi
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase15-status.txt phase15-static.json
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Phase 15 conversion gate'; git push; fi
