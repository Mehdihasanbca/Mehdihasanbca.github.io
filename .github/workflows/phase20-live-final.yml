name: AVC Phase 20.1 Razorpay Live Final

on:
  push:
    branches: [main]
    paths:
      - phase20-live-final-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_LIVE_API_KEY }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_LIVE_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TRUSTED_FLAG: ${{ vars.RAZORPAY_TRUSTED_BUSINESS_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy secure payment API and record state
        shell: bash
        run: |
          set +e
          for v in "${RAZORPAY_KEY_ID:-}" "${RAZORPAY_KEY_SECRET:-}" "${RAZORPAY_WEBHOOK_SECRET:-}" "${CLOUDFLARE_API_TOKEN:-}"; do [ -z "$v" ] || echo "::add-mask::$v"; done

          rzp_id=no; rzp_secret=no; rzp_auth=no; cf_present=no; cf_auth=no; deploy=no; worker_secrets=no; health=no; checkout=false
          [ -n "${RAZORPAY_KEY_ID:-}" ] && rzp_id=yes
          [ -n "${RAZORPAY_KEY_SECRET:-}" ] && rzp_secret=yes
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && cf_present=yes

          if [ "$rzp_id" = yes ] && [ "$rzp_secret" = yes ]; then
            code="$(curl -sS -o /tmp/rzp.json -w '%{http_code}' -u "${RAZORPAY_KEY_ID}:${RAZORPAY_KEY_SECRET}" 'https://api.razorpay.com/v1/orders?count=1' || true)"
            [ "$code" = 200 ] && rzp_auth=yes
          fi

          if [ "$cf_present" = yes ]; then
            code="$(curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 'https://api.cloudflare.com/client/v4/user/tokens/verify' || true)"
            if [ "$code" = 200 ] && grep -Fq '"success":true' /tmp/cf.json; then cf_auth=yes; fi
          fi

          if [ "$rzp_auth" = yes ] && [ "$cf_auth" = yes ] && [[ "${RAZORPAY_KEY_ID:-}" == rzp_live_* ]]; then
            npm install --no-save wrangler@4 >/dev/null 2>&1
            npx wrangler deploy >/tmp/wrangler.log 2>&1
            [ $? -eq 0 ] && deploy=yes
            if [ "$deploy" = yes ]; then
              printf '%s' "$RAZORPAY_KEY_ID" | npx wrangler secret put RAZORPAY_KEY_ID >/tmp/s1.log 2>&1; a=$?
              printf '%s' "$RAZORPAY_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET >/tmp/s2.log 2>&1; b=$?
              if [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ]; then printf '%s' "$RAZORPAY_WEBHOOK_SECRET" | npx wrangler secret put RAZORPAY_WEBHOOK_SECRET >/tmp/s3.log 2>&1; fi
              [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && worker_secrets=yes
            fi
          fi

          if [ "$worker_secrets" = yes ]; then
            for i in $(seq 1 15); do
              body="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://assignmentvenuecentre.me/api/payments/health?ts=$(date +%s)" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq '"service":"avc-payment-api"' && printf '%s' "$body" | grep -Fq '"razorpayConfigured":true' && printf '%s' "$body" | grep -Fq '"totalPaise":177000' && printf '%s' "$body" | grep -Fq '"wafidThirdPartyFeeIncluded":false'; then health=yes; break; fi
              sleep 6
            done
          fi

          [ "$rzp_auth" = yes ] && [ "$cf_auth" = yes ] && [ "$health" = yes ] && checkout=true
          trusted=false; [ "${TRUSTED_FLAG:-}" = true ] && trusted=true
          public_key=''; [ "$checkout" = true ] && public_key="$RAZORPAY_KEY_ID"

          cat > assets/payment-config.js <<EOF
          window.AVC_PAYMENT_CONFIG=Object.freeze({
            mode:'live',
            checkoutEnabled:$checkout,
            trustedBusinessClaimEnabled:$trusted,
            razorpayKeyId:'$public_key',
            orderEndpoint:'/api/payments/order',
            verifyEndpoint:'/api/payments/verify',
            webhookManagedServerSide:true,
            serviceBasePaise:150000,
            gstRate:18,
            gstPaise:27000,
            serviceTotalPaise:177000,
            wafidThirdPartyFeeIncluded:false,
            supportEmail:'info@assignmentvenuecentre.me',
            supportPhone:'+91 9473286356',
            note:'Razorpay service payment is ₹1,770 for AVC assistance only. Wafid third-party cost is separate. Key Secret remains server-side.'
          });
          EOF

          {
            echo 'AVC Phase 20.1 final live payment deployment'
            echo "razorpay_key_id_present=$rzp_id"
            echo "razorpay_key_secret_present=$rzp_secret"
            echo "razorpay_api_auth=$rzp_auth"
            echo "cloudflare_api_token_present=$cf_present"
            echo "cloudflare_api_auth=$cf_auth"
            echo "worker_deployed=$deploy"
            echo "worker_razorpay_secrets_set=$worker_secrets"
            echo "payment_api_health=$health"
            echo "checkout_enabled=$checkout"
            echo 'avc_service_base_paise=150000'
            echo 'gst_rate_percent=18'
            echo 'gst_paise=27000'
            echo 'razorpay_order_total_paise=177000'
            echo 'wafid_third_party_fee_included=no'
            echo "razorpay_webhook_secret_present=$([ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ] && echo yes || echo no)"
            echo "trusted_business_claim_enabled=$trusted"
            echo 'secret_values_exposed=no'
            if [ "$checkout" = true ]; then echo 'status=success_live_checkout'; else echo 'status=blocked_not_live'; fi
            echo "checked_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > phase20-live-status.txt
          cat phase20-live-status.txt

      - name: Commit public activation evidence
        if: always()
        run: |
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/payment-config.js phase20-live-status.txt
          if ! git diff --cached --quiet; then git commit -m 'Record AVC Razorpay final live deployment'; git push; fi
