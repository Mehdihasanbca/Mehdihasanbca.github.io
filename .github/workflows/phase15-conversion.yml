name: AVC Phase 15 Conversion Flow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/phase15_integrate.py'
      - 'phase15-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avc-phase15-conversion
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate audience conversion routes
        run: |
          python scripts/phase15_integrate.py
          python scripts/build_job_pages.py

      - name: Validate static conversion architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json, sys
          root=Path('.')
          failures=[]
          def text(path): return (root/path).read_text(encoding='utf-8')
          checks={
            'candidates.html':['apply.html?source=candidates','assets/measurement.js?v=20260807-p15'],
            'employers.html':['employer-requirement.html?source=employers','assets/measurement.js?v=20260807-p15'],
            'partners.html':['partner-enquiry.html?source=partners','assets/measurement.js?v=20260807-p15'],
            'jobs.html':['apply.html?source=jobs','assets/jobs.js?v=20260807-p15','assets/measurement.js?v=20260807-p15'],
            'assets/jobs.js':['apply.html?source=jobs&job='],
            'scripts/build_job_pages.py':['apply.html?source=vacancy&job='],
            'apply.html':['data-flow="candidate-apply"','noindex,follow','data-apply-final'],
            'employer-requirement.html':['data-flow="employer-requirement"','data-compose-email','info@assignmentvenuecentre.me'],
            'partner-enquiry.html':['data-flow="partner-enquiry"','data-compose-email','info@assignmentvenuecentre.me'],
            'assets/conversion.js':['data/jobs.json','candidate_form_open','employer_requirement','partner_enquiry'],
            'assets/measurement.js':['apply_gateway','employer_requirement','partner_enquiry','source','job'],
            'assets/seo.js':['employer-requirement.html','partner-enquiry.html'],
          }
          for path,needles in checks.items():
            body=text(path)
            for needle in needles:
              if needle not in body: failures.append(f'{path}: missing {needle}')
          for path in ['employer-requirement.html','partner-enquiry.html']:
            body=text(path).lower()
            if '<form' in body: failures.append(f'{path}: must not contain a fake/backend form')
          app=text('apply.html')
          if 'https://forms.gle/1nVwzXHiHV9Cjw4A9' not in app: failures.append('apply.html: official form fallback missing')
          sm=ET.parse(root/'sitemap.xml').getroot(); ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs={n.text for n in sm.findall('s:url/s:loc',ns)}
          for url in ['https://assignmentvenuecentre.me/employer-requirement.html','https://assignmentvenuecentre.me/partner-enquiry.html']:
            if url not in locs: failures.append(f'sitemap missing {url}')
          if 'https://assignmentvenuecentre.me/apply.html' in locs: failures.append('apply.html must remain out of sitemap because it is noindex')
          result={'status':'success' if not failures else 'failed','failures':failures,'warnings':[]}
          Path('phase15-static.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          if failures: sys.exit(1)
          PY

      - name: Commit Phase 15 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidates.html employers.html partners.html jobs.html assets/seo.js sitemap.xml sitemap-jobs.xml
          if [ -d vacancies ]; then git add -A vacancies; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate AVC Phase 15 conversion routes'
            git push
          fi

      - name: Verify live conversion routes
        run: |
          python - <<'PY'
          import time, urllib.request
          from pathlib import Path
          base='https://assignmentvenuecentre.me'
          checks=[
            ('/apply.html','Official AVC application gateway'),
            ('/employer-requirement.html','Employer requirement intake'),
            ('/partner-enquiry.html','Recruitment partner enquiry'),
            ('/candidates.html','apply.html?source=candidates'),
            ('/employers.html','employer-requirement.html?source=employers'),
            ('/partners.html','partner-enquiry.html?source=partners'),
            ('/jobs.html','apply.html?source=jobs'),
            ('/assets/jobs.js','apply.html?source=jobs&job='),
            ('/assets/conversion.js','candidate_form_open'),
            ('/assets/measurement.js','apply_gateway'),
            ('/sitemap.xml','employer-requirement.html'),
            ('/sitemap.xml','partner-enquiry.html'),
          ]
          failures=[]; details=[]
          def fetch(path,needle):
            last=''
            for _ in range(15):
              url=base+path+('?phase15='+str(int(time.time())) if '?' not in path else '&phase15='+str(int(time.time())))
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'AVC-Phase15-Gate/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read().decode('utf-8','replace')
                  if r.status==200 and needle in body:return r.status,True
                  last=f'{r.status}; marker={needle in body}'
              except Exception as e:last=str(e)
              time.sleep(8)
            return last,False
          for path,needle in checks:
            status,ok=fetch(path,needle)
            details.append(f'{base+path} -> {status}; marker={"yes" if ok else "no"}')
            if not ok: failures.append(f'{path}: expected live marker missing')
          status='success' if not failures else 'failed'
          lines=['AVC Phase 15 conversion flow gate',f'status: {status}',f'live_checks: {len(checks)}',f'failures: {len(failures)}','warnings: 0','candidate_submission: official external form only','employer_intake: official email only','partner_intake: official email only','website_data_collection: none in Phase 15','failure_details:',*failures,'live_details:',*details,'checked_at_utc: '+time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())]
          Path('phase15-status.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          if failures: raise SystemExit(1)
          PY

      - name: Commit Phase 15 evidence
        if: always()
        run: |
          if [ ! -f phase15-status.txt ]; then exit 0; fi
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase15-status.txt phase15-static.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record AVC Phase 15 conversion gate'
            git push
          fi
