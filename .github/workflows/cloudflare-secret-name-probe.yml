name: AVC Cloudflare Secret Name Probe

on:
  pull_request:
    branches: [main]
    paths:
      - cloudflare-secret-name-trigger.txt
      - .github/workflows/cloudflare-secret-name-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Print matching secret names only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          try: d=json.loads(os.environ.get('ALL_SECRETS_JSON') or '{}')
          except Exception: d={}
          names=[]
          for k in d:
              u=k.upper()
              if 'CLOUDFLARE' in u or u.startswith('CF_'):
                  names.append(k)
          print('matching_cloudflare_secret_names=' + (','.join(sorted(names)) if names else 'none'))
          print('secret_values_exposed=no')
          PY
