name: AVC Vacancy Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'assets/jobs.js'
      - 'scripts/build_job_pages.py'
      - 'scripts/verify_job_pages.py'
      - '.github/workflows/job-pages.yml'
      - 'phase13-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avc-vacancy-pages
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate detail pages
        run: python scripts/build_job_pages.py | tee phase13-build-result.txt

      - name: Validate publication data
        run: python scripts/vacancy_manager.py validate

      - name: Validate generated architecture
        run: python scripts/verify_job_pages.py static

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap-jobs.xml phase13-static.json
          if [ -d vacancies ]; then git add -A vacancies; fi
          if ! git diff --cached --quiet; then
            git commit -m "Generate verified AVC vacancy pages"
            git push
          fi

      - name: Verify live publication
        run: python scripts/verify_job_pages.py live

      - name: Commit publication evidence
        if: always()
        run: |
          if [ ! -f phase13-status.txt ]; then exit 0; fi
          cp phase13-status.txt /tmp/phase13-status.txt
          git restore phase13-status.txt 2>/dev/null || rm -f phase13-status.txt
          git pull --rebase
          cp /tmp/phase13-status.txt phase13-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase13-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record AVC Phase 13 vacancy page gate"
            git push
          fi
