name: AVC ERP Production API Fingerprint

on:
  push:
    branches: [main]
    paths:
      - phase20-api-fingerprint-trigger.txt
      - scripts/phase20_api_fingerprint.py
      - .github/workflows/phase20-api-fingerprint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/phase20_api_fingerprint.py
      - name: Commit production fingerprint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase20-api-production-fingerprint.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record AVC ERP production API fingerprint'
            git pull --rebase
            git push
          fi
